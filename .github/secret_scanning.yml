# The corpus files are test fixtures. Every credential in tp-corpus.txt and
# tp-corpus.json is synthetic, generated from a fixed seed, and has never been a
# live key -- that is the entire point of the file, and it is stated in the
# header of both. Excluding them here keeps push protection and alerting pointed
# at real leaks instead of at the material this repository exists to publish.
paths-ignore:
  - "tp-corpus.txt"
  - "tp-corpus.json"
